<div class="list-container" style="border: 1px solid #ccc; padding: 20px; border-radius: 8px;">
  <h3>Listado de Clientes</h3>
  <div *ngIf="errorMessage" style="color: red; font-weight: bold; margin-bottom: 10px;">{{ errorMessage }}</div>
  
  <table style="width: 100%; border-collapse: collapse;" *ngIf="clientes.length > 0; else emptyState">
    <thead>
      <tr style="background-color: #f2f2f2; text-align: left;">
        <th style="padding: 10px; border: 1px solid #ddd;">Código</th>
        <th style="padding: 10px; border: 1px solid #ddd;">Nombre</th>
        <th style="padding: 10px; border: 1px solid #ddd;">Dirección</th>
        <th style="padding: 10px; border: 1px solid #ddd;">Teléfono</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let c of clientes">
        <td style="padding: 10px; border: 1px solid #ddd;">{{ c.codigo_cliente }}</td>
        <td style="padding: 10px; border: 1px solid #ddd;">{{ c.nombre_cliente }}</td>
        <td style="padding: 10px; border: 1px solid #ddd;">{{ c.direccion_cliente }}</td>
        <td style="padding: 10px; border: 1px solid #ddd;">{{ c.telefono }}</td>
      </tr>
    </tbody>
  </table>

  <ng-template #emptyState>
    <p>No hay clientes registrados en este momento.</p>
  </ng-template>
</div>
